services:
  - type: web
    name: ngethe-advocates
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: ngethe-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/ngethe.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
