services:
  - type: web
    name: ngethe-advocates
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
